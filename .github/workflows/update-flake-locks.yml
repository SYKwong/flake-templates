name: Update flake.lock

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update template flake locks
        run: |
          for dir in */; do
            if [ -f "${dir}flake.nix" ]; then
              echo "Updating ${dir}flake.lock..."
              nix flake update --flake "./${dir}"
            fi
          done

      - name: Verify template flakes
        run: |
          nix flake show --all-systems
          for dir in */; do
            if [ -f "${dir}flake.nix" ]; then
              nix flake show --all-systems "./${dir}"
            fi
          done
          nix develop ./c --command just -f c/justfile -d c run
          nix develop ./c --command just -f c/justfile -d c clean

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-flake-locks
          delete-branch: true
          commit-message: "chore(flake): update template flake.lock files"
          title: "chore(flake): update template flake.lock files"
          body: "Automated weekly `nix flake update` for all template flakes (verified with `nix flake show --all-systems` and `just run`)."

      - name: Auto-merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || gh pr merge "$PR_NUMBER" --squash --delete-branch
