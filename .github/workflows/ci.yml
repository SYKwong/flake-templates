name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check root flake
        run: nix flake show --all-systems

      - name: Check template flakes
        run: |
          for f in */flake.nix */*/flake.nix; do
            [ -f "$f" ] || continue
            dir="$(dirname "$f")"
            echo "Checking ${dir}..."
            nix flake show --all-systems "./${dir}"
          done

      - name: Test C (Clang) template
        run: nix develop ./c/clang --command just -f c/clang/justfile -d c/clang run

      - name: Test C (GCC) template
        run: nix develop ./c/gcc --command just -f c/gcc/justfile -d c/gcc run
