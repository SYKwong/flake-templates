name: Notify Docs Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
    steps:
      - name: Trigger nix-docs rebuild
        if: env.DOCS_DISPATCH_TOKEN != ''
        run: |
          gh api repos/SYKwong/nix-docs/dispatches \
            -f event_type=docs-updated
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
