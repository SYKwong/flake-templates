name: Update flake.lock

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update template flake locks
        run: |
          for f in */flake.nix */*/flake.nix; do
            [ -f "$f" ] || continue
            dir="$(dirname "$f")"
            echo "Updating ${dir}/flake.lock..."
            nix flake update --flake "./${dir}"
          done

      - name: Update template Ruby gems
        run: |
          for f in */Gemfile */*/Gemfile; do
            [ -f "$f" ] || continue
            dir="$(dirname "$f")"
            echo "Updating ${dir}/Gemfile.lock and ${dir}/gemset.nix..."
            nix develop "./${dir}" --command just -f "${dir}/justfile" -d "${dir}" update-gems
          done

      - name: Verify flake outputs
        run: |
          nix flake show --all-systems
          for f in */flake.nix */*/flake.nix; do
            [ -f "$f" ] || continue
            dir="$(dirname "$f")"
            nix flake show --all-systems "./${dir}"
          done

      - name: Test C (Clang) template
        run: |
          nix develop ./c/clang --command just -f c/clang/justfile -d c/clang run
          nix develop ./c/clang --command just -f c/clang/justfile -d c/clang clean

      - name: Test C (GCC) template
        run: |
          nix develop ./c/gcc --command just -f c/gcc/justfile -d c/gcc run
          nix develop ./c/gcc --command just -f c/gcc/justfile -d c/gcc clean

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTO_PAT || github.token }}
          branch: chore/update-flake-locks
          delete-branch: true
          commit-message: "chore(deps): update flake.lock and patch gem dependencies"
          title: "chore(deps): update flake.lock and patch gem dependencies"
          body: "Automated weekly `nix flake update` and patch Ruby gem updates (`just update-gems`) for all template flakes (verified with `nix flake show --all-systems` and `just run`)."

      - name: Auto-merge pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTO_PAT || github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
