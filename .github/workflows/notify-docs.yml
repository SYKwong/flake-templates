name: Notify Docs Site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      AUTO_PAT: ${{ secrets.AUTO_PAT }}
    steps:
      - name: Trigger nix-docs rebuild
        if: env.AUTO_PAT != ''
        run: |
          gh api repos/SYKwong/nix-docs/dispatches \
            -f event_type=docs-updated
        env:
          GH_TOKEN: ${{ secrets.AUTO_PAT }}
